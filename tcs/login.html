<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — TCS2</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body class="login-body">

<div class="login-card">
    <div class="login-logo">
        <div class="sidebar-logo-badge">TC</div>
        TCS2
    </div>
    <h1>Вход в систему</h1>
    <p class="login-sub">Панель управления TimeCalculateSystem</p>

    <div class="form-group">
        <label for="loginUsername">Логин</label>
        <input type="text" id="loginUsername" autocomplete="username">
    </div>
    <div class="form-group">
        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <div class="modal-error" id="loginError"></div>
    <button class="btn btn-save" id="loginSubmitBtn" style="width:100%;" onclick="submitLogin()" type="button">Войти</button>
</div>

<script>
    const LOGIN_URL = 'https://n8n.vseproi.de/webhook/tcs2-login';

    if (getAuthToken()) {
        window.location.href = 'dashboard.html';
    }

    ['loginUsername', 'loginPassword'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', (e) => {
            if (e.key === 'Enter') submitLogin();
        });
    });

    async function submitLogin() {
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorBox = document.getElementById('loginError');
        errorBox.classList.remove('show');

        if (!username || !password) {
            errorBox.textContent = 'Введите логин и пароль';
            errorBox.classList.add('show');
            return;
        }

        const btn = document.getElementById('loginSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Вход...';

        try {
            const res = await fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || 'Не удалось войти');

            setAuthSession(data.token, data.user);
            window.location.href = 'dashboard.html';
        } catch (e) {
            console.error(e);
            errorBox.textContent = e.message || 'Ошибка входа. Попробуйте ещё раз.';
            errorBox.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Войти';
        }
    }
</script>

</body>
</html>
