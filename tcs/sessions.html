<!DOCTYPE html>
<html lang="ru" data-i18n-doctitle="sessions_doctitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рабочие сессии</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
<script src="i18n.js"></script>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-footer" id="sidebarUser"></div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-logo">
        <div class="sidebar-logo-badge">TC</div>
        TCS2
    </div>
</aside>

<div class="main">
<div class="page">
    <div class="topbar">
        <div>
            <h1 data-i18n="sessions_heading">Рабочие сессии</h1>
            <p data-i18n="sessions_sub">Все рабочие сессии сотрудников и расчёты по ним</p>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
            <span data-i18n="refresh">Обновить</span>
        </button>
    </div>

    <div id="errorBox" class="error-box" style="display:none;"></div>

    <div class="stats-row" id="statsRow"></div>

    <div class="filters-row" id="filtersRow">
        <button type="button" class="filters-toggle" onclick="toggleFiltersRow('filtersRow')">
            <svg class="filters-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h12M4.5 8h7M7 12.5h2"/></svg>
            <span data-i18n="filters">Фильтры</span>
            <span class="filters-badge">0</span>
            <svg class="filters-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <div class="filters-content">
            <div class="filter-group">
                <label for="filterEmployee" data-i18n="sessions_filter_employee">Сотрудник</label>
                <select id="filterEmployee" onchange="loadData()">
                    <option value="" data-i18n="sessions_filter_all_employees">Все сотрудники</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterProject" data-i18n="sessions_filter_project">Объект</label>
                <select id="filterProject" onchange="loadData()">
                    <option value="" data-i18n="sessions_filter_all_objects">Все объекты</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterDateFrom" data-i18n="sessions_filter_date_from">Дата от</label>
                <input type="date" id="filterDateFrom" onchange="loadData()">
            </div>
            <div class="filter-group">
                <label for="filterDateTo" data-i18n="sessions_filter_date_to">Дата до</label>
                <input type="date" id="filterDateTo" onchange="loadData()">
            </div>
            <div class="filter-group">
                <label for="filterPaid" data-i18n="sessions_filter_paid">Оплата</label>
                <select id="filterPaid" onchange="loadData()">
                    <option value="" data-i18n="all">Все</option>
                    <option value="true" data-i18n="sessions_filter_paid_yes">Оплачено</option>
                    <option value="false" data-i18n="sessions_filter_paid_no">Не оплачено</option>
                </select>
            </div>
            <button class="filter-reset-btn" onclick="resetFilters()" data-i18n="filters_reset">Сбросить фильтры</button>
        </div>
    </div>

    <div id="sessionsContent"></div>
</div>
</div>

<!-- Edit session modal -->
<div class="overlay" id="editSessionOverlay">
    <div class="modal">
        <div id="editSessionForm">
            <div class="modal-header">
                <div class="avatar" id="sessionAvatar"></div>
                <div>
                    <div class="modal-title" id="sessionTitle" data-i18n="sessions_modal_title">Рабочая сессия</div>
                    <div class="modal-subtitle" data-i18n="sessions_modal_sub">Редактирование сессии</div>
                </div>
                <div class="modal-header-active">
                    <span class="toggle-label" data-i18n="sessions_filter_paid_yes">Оплачено</span>
                    <label class="switch">
                        <input type="checkbox" id="sessionIsPaid">
                        <span class="switch-track"></span>
                    </label>
                </div>
            </div>
            <div class="modal-body">
                <div class="readonly-info" id="sessionNoteInfo" style="display:none;"></div>

                <div class="form-group">
                    <label for="sessionProject"><span data-i18n="sessions_label_object">Объект</span> <span class="req">*</span></label>
                    <select id="sessionProject" onchange="validateEditSessionForm()">
                        <option value="" data-i18n="sessions_select_object">Выберите объект</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="sessionRate"><span data-i18n="label_rate">Ставка</span> <span class="req">*</span></label>
                    <select id="sessionRate" onchange="validateEditSessionForm()">
                        <option value="" data-i18n="select_rate">Выберите ставку</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="sessionStart"><span data-i18n="sessions_label_start">Начало</span> <span class="req">*</span></label>
                        <input type="datetime-local" id="sessionStart" oninput="validateEditSessionForm()">
                    </div>
                    <div class="form-group">
                        <label for="sessionEnd" data-i18n="sessions_label_end">Окончание</label>
                        <input type="datetime-local" id="sessionEnd">
                    </div>
                </div>
            </div>
            <div class="modal-error" id="sessionError"></div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeEditSessionModal()" data-i18n="cancel">Отмена</button>
                <button class="btn action-btn secondary" id="forceEndBtn" onclick="forceEndSession()" style="display:none; flex:1; margin-top:0;" data-i18n="sessions_btn_force_end">Завершить сессию</button>
                <button class="btn btn-save" id="sessionSaveBtn" disabled onclick="submitEditSession()" data-i18n="save">Сохранить</button>
            </div>
        </div>
        <div class="modal-success" id="sessionSuccess">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
            <div class="title" data-i18n="sessions_saved_title">Сохранено</div>
            <div class="sub" id="sessionSuccessSub"></div>
        </div>
    </div>
</div>

<!-- Media preview modal -->
<div class="overlay" id="mediaOverlay">
    <div class="modal">
        <div class="modal-header">
            <div>
                <div class="modal-title" data-i18n="sessions_media_title">Фото/видео отчёты</div>
                <div class="modal-subtitle" id="mediaSubtitle"></div>
            </div>
        </div>
        <div class="media-grid" id="mediaGrid"></div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeMediaModal()" data-i18n="close">Закрыть</button>
        </div>
    </div>
</div>

<script>
    // ==========================================================
    // Config
    // ==========================================================
    const GET_SESSIONS_URL = 'https://n8n.vseproi.de/webhook/tcs2-get-work-sessions';
    const GET_PROJECTS_URL = 'https://n8n.vseproi.de/webhook/tcs2-get-projects';
    const UPDATE_SESSION_URL = 'https://n8n.vseproi.de/webhook/tcs2-update-work-session';
    const FORCE_END_URL = 'https://n8n.vseproi.de/webhook/tcs2-force-end-session';
    const GET_MEDIA_URL = 'https://n8n.vseproi.de/webhook/tcs2-get-session-media';

    // ==========================================================
    // State
    // ==========================================================
    let sessions = [];
    let summary = { total_sessions: 0, total_hours: 0, total_amount: 0, paid_amount: 0, unpaid_amount: 0 };
    let filterEmployees = [];
    let hourlyRates = [];
    let activeProjects = [];
    let currentSession = null;
    let saving = false;

    // ==========================================================
    // Helpers
    // ==========================================================
    function employeeAvatarHtml(s) {
        if (s.avatar_url) return `<img class="avatar" src="${escapeHtml(s.avatar_url)}" alt="">`;
        const parts = (s.employee_name || '').trim().split(/\s+/);
        const ini = ((parts[0] ? parts[0][0] : '') + (parts[1] ? parts[1][0] : '')).toUpperCase() || '?';
        return `<div class="avatar">${escapeHtml(ini)}</div>`;
    }

    function money(n) {
        return (n == null ? 0 : Number(n)).toLocaleString('uk-UA', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' ₴';
    }

    function hours(n) {
        return (n == null ? 0 : Number(n)).toLocaleString('uk-UA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function rateLabel(id) {
        const r = hourlyRates.find(x => x.id === id);
        return r ? t('rate_label_format', { price: r.price_per_hour, position: r.position_name || '' }) : '—';
    }

    // ==========================================================
    // Load data
    // ==========================================================
    function buildQuery() {
        const params = new URLSearchParams();
        const employeeId = document.getElementById('filterEmployee').value;
        const projectId = document.getElementById('filterProject').value;
        const dateFrom = document.getElementById('filterDateFrom').value;
        const dateTo = document.getElementById('filterDateTo').value;
        const isPaid = document.getElementById('filterPaid').value;
        if (employeeId) params.set('employee_id', employeeId);
        if (projectId) params.set('project_id', projectId);
        if (dateFrom) params.set('date_from', dateFrom);
        if (dateTo) params.set('date_to', dateTo);
        if (isPaid) params.set('is_paid', isPaid);
        return params.toString();
    }

    async function loadData() {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.classList.add('spinning');
        hideError();

        try {
            const query = buildQuery();
            const [sessionsRes, projectsRes] = await Promise.all([
                authFetch(GET_SESSIONS_URL + (query ? '?' + query : ''), { method: 'GET' }),
                authFetch(GET_PROJECTS_URL, { method: 'GET' })
            ]);
            if (!sessionsRes.ok) throw new Error('HTTP ' + sessionsRes.status);
            if (!projectsRes.ok) throw new Error('HTTP ' + projectsRes.status);

            const data = await sessionsRes.json();
            if (!data.success) throw new Error(data.error || t('sessions_load_error'));

            const projectsData = await projectsRes.json();
            if (!projectsData.success) throw new Error(projectsData.error || t('objects_load_error_generic'));

            sessions = data.sessions || [];
            summary = data.summary || summary;
            filterEmployees = data.employees || [];
            hourlyRates = data.hourly_rates || [];
            activeProjects = (projectsData.projects || []).filter(p => p.is_active);

            populateFilterOptions();
            renderStats();
            renderSessions();
        } catch (e) {
            console.error(e);
            showError(t('sessions_load_failed'));
            document.getElementById('sessionsContent').innerHTML = '';
        } finally {
            btn.disabled = false;
            btn.classList.remove('spinning');
        }
    }

    function populateFilterOptions() {
        const empSelect = document.getElementById('filterEmployee');
        const currentEmp = empSelect.value;
        empSelect.innerHTML = `<option value="">${t('sessions_filter_all_employees')}</option>` + filterEmployees.map(e =>
            `<option value="${e.id}">${escapeHtml(e.full_name)}</option>`
        ).join('');
        empSelect.value = currentEmp;

        const projSelect = document.getElementById('filterProject');
        const currentProj = projSelect.value;
        projSelect.innerHTML = `<option value="">${t('sessions_filter_all_objects')}</option>` + activeProjects.map(p =>
            `<option value="${p.id}">${escapeHtml(p.project_name)}</option>`
        ).join('');
        projSelect.value = currentProj;

        updateFiltersBadge('filtersRow');
    }

    function resetFilters() {
        document.getElementById('filterEmployee').value = '';
        document.getElementById('filterProject').value = '';
        document.getElementById('filterDateFrom').value = '';
        document.getElementById('filterDateTo').value = '';
        document.getElementById('filterPaid').value = '';
        loadData();
    }

    // ==========================================================
    // Summary
    // ==========================================================
    function renderStats() {
        const s = summary;
        const total = Number(s.total_amount) || 0;
        const paid = Number(s.paid_amount) || 0;
        const paidPct = total > 0 ? Math.min(100, (paid / total) * 100) : 0;

        document.getElementById('statsRow').innerHTML = `
            <div class="stat-card">
                <div class="stat-label">${t('sessions_stat_count')}</div>
                <div class="stat-value">${s.total_sessions}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">${t('sessions_stat_hours')}</div>
                <div class="stat-value">${hours(s.total_hours)}</div>
            </div>
            <div class="stat-card revenue-card">
                <div class="revenue-header">
                    <div class="stat-label">${t('sessions_stat_total')}</div>
                    <div class="stat-value">${money(s.total_amount)}</div>
                </div>
                <div class="revenue-bar"><div class="revenue-bar-paid" style="width:${paidPct}%"></div></div>
                <div class="revenue-split">
                    <div class="revenue-split-item">
                        <div class="revenue-split-label">${t('sessions_filter_paid_yes')}</div>
                        <div class="revenue-split-value">${money(s.paid_amount)}</div>
                    </div>
                    <div class="revenue-split-item unpaid">
                        <div class="revenue-split-label">${t('sessions_filter_paid_no')}</div>
                        <div class="revenue-split-value">${money(s.unpaid_amount)}</div>
                    </div>
                </div>
            </div>`;
    }

    // ==========================================================
    // Session list
    // ==========================================================
    function renderSessions() {
        const content = document.getElementById('sessionsContent');
        if (sessions.length === 0) {
            content.innerHTML = emptyStateHtml(t('sessions_empty'));
            return;
        }
        content.innerHTML = `<div class="session-list">${sessions.map(sessionRowHtml).join('')}</div>`;
    }

    function sessionRowHtml(s) {
        const timeRange = `${s.start_time || '—'} – ${s.end_time || t('sessions_active_label')}`;
        return `
            <div class="session-row${s.is_paid ? ' paid' : ''}" onclick="openEditSessionModal(${s.id})">
                <div class="session-row-top">
                    <div class="session-employee">
                        ${employeeAvatarHtml(s)}
                        <div class="session-employee-text">
                            <div class="session-employee-name">${escapeHtml(s.employee_name)}</div>
                            <div class="session-employee-rate">${s.price_per_hour != null ? t('sessions_rate_per_hour', { price: s.price_per_hour }) : '—'}</div>
                        </div>
                    </div>
                    <div class="session-top-right">
                        <div class="session-icons">
                            ${s.note_text ? `<svg class="session-icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" title="${escapeHtml(s.note_text)}"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>` : ''}
                            ${s.media_count > 0 ? `<button class="session-icon-media" onclick="event.stopPropagation(); openMediaModal(${s.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-4-4 3-3-2-6 5"/></svg>${s.media_count}</button>` : ''}
                        </div>
                        <div class="session-project">${escapeHtml(s.project_name)}</div>
                    </div>
                </div>
                <div class="session-row-bottom">
                    <div class="session-datetime">
                        <div class="session-date">${s.session_date}</div>
                        <div class="session-time">${timeRange}</div>
                    </div>
                    <div class="session-bottom-right">
                        <div class="session-hours">${s.duration_hours != null ? hours(s.duration_hours) + ' ' + t('dashboard_hours_short') : '—'}</div>
                        <div class="session-amount${s.is_paid ? ' paid' : ''}">
                            ${s.calculated_salary != null ? money(s.calculated_salary) : '—'}
                            ${s.debt_applied > 0 ? `<div class="session-amount-note">−${money(s.debt_applied)} ${t('sessions_advance_note')}</div>` : ''}
                        </div>
                    </div>
                </div>
            </div>`;
    }

    // ==========================================================
    // Edit session modal
    // ==========================================================
    function openEditSessionModal(sessionId) {
        currentSession = sessions.find(s => s.id === sessionId);
        if (!currentSession) return;
        const s = currentSession;

        document.getElementById('sessionAvatar').outerHTML = employeeAvatarHtml(s).replace('class="avatar"', 'class="avatar" id="sessionAvatar"');
        document.getElementById('sessionTitle').textContent = s.employee_name;
        document.getElementById('sessionIsPaid').checked = !!s.is_paid;

        if (s.note_text) {
            document.getElementById('sessionNoteInfo').style.display = 'flex';
            document.getElementById('sessionNoteInfo').innerHTML = `<div><b>${s.note_type_name === 'warning' ? t('sessions_note_warning') : t('sessions_note_note')}:</b> ${escapeHtml(s.note_text)}</div>`;
        } else {
            document.getElementById('sessionNoteInfo').style.display = 'none';
        }

        const projSelect = document.getElementById('sessionProject');
        projSelect.innerHTML = `<option value="">${t('sessions_select_object')}</option>` + activeProjects.map(p =>
            `<option value="${p.id}">${escapeHtml(p.project_name)}</option>`
        ).join('');
        projSelect.value = s.project_id;

        const rateSelect = document.getElementById('sessionRate');
        rateSelect.innerHTML = `<option value="">${t('select_rate')}</option>` + hourlyRates.map(r =>
            `<option value="${r.id}">${t('rate_label_format', { price: r.price_per_hour, position: escapeHtml(r.position_name || '') })}</option>`
        ).join('');
        rateSelect.value = s.hourly_rate_id;

        document.getElementById('sessionStart').value = s.start_datetime_local || '';
        document.getElementById('sessionEnd').value = s.end_datetime_local || '';

        document.getElementById('forceEndBtn').style.display = s.end_datetime_local ? 'none' : 'block';

        document.getElementById('sessionError').classList.remove('show');
        document.getElementById('editSessionForm').style.display = 'block';
        document.getElementById('sessionSuccess').classList.remove('show');

        validateEditSessionForm();
        document.getElementById('editSessionOverlay').classList.add('show');
    }

    function closeEditSessionModal() {
        if (saving) return;
        document.getElementById('editSessionOverlay').classList.remove('show');
        currentSession = null;
    }

    function validateEditSessionForm() {
        const project = document.getElementById('sessionProject').value;
        const rate = document.getElementById('sessionRate').value;
        const start = document.getElementById('sessionStart').value;
        document.getElementById('sessionSaveBtn').disabled = !(project && rate && start);
    }

    async function submitEditSession() {
        if (!currentSession || saving) return;

        const payload = {
            session_id: currentSession.id,
            project_id: Number(document.getElementById('sessionProject').value),
            hourly_rate_id: Number(document.getElementById('sessionRate').value),
            start_datetime: document.getElementById('sessionStart').value,
            end_datetime: document.getElementById('sessionEnd').value || null,
            is_paid: document.getElementById('sessionIsPaid').checked
        };

        const errorBox = document.getElementById('sessionError');
        errorBox.classList.remove('show');

        saving = true;
        const saveBtn = document.getElementById('sessionSaveBtn');
        saveBtn.disabled = true;
        saveBtn.textContent = t('saving');

        try {
            const res = await authFetch(UPDATE_SESSION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || t('sessions_save_error'));

            document.getElementById('editSessionForm').style.display = 'none';
            document.getElementById('sessionSuccessSub').textContent = t('sessions_saved_sub');
            document.getElementById('sessionSuccess').classList.add('show');

            setTimeout(() => { closeEditSessionModal(); loadData(); }, 1200);
        } catch (e) {
            console.error(e);
            errorBox.textContent = e.message || t('save_error_retry');
            errorBox.classList.add('show');
        } finally {
            saving = false;
            saveBtn.disabled = false;
            saveBtn.textContent = t('save');
            validateEditSessionForm();
        }
    }

    async function forceEndSession() {
        if (!currentSession || saving) return;
        if (!confirm(t('sessions_confirm_force_end', { name: currentSession.employee_name }))) return;

        saving = true;
        try {
            const res = await authFetch(FORCE_END_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: currentSession.id })
            });
            const data = await res.json();
            if (!res.ok || !data.success) throw new Error(data.error || t('sessions_force_end_error'));

            closeEditSessionModal();
            loadData();
        } catch (e) {
            console.error(e);
            document.getElementById('sessionError').textContent = e.message || t('sessions_force_end_error_generic');
            document.getElementById('sessionError').classList.add('show');
        } finally {
            saving = false;
        }
    }

    // ==========================================================
    // Media modal
    // ==========================================================
    async function openMediaModal(sessionId) {
        const s = sessions.find(x => x.id === sessionId);
        document.getElementById('mediaSubtitle').textContent = s ? s.employee_name + ' — ' + s.session_date : '';
        document.getElementById('mediaGrid').innerHTML = emptyStateHtml(t('loading'));
        document.getElementById('mediaOverlay').classList.add('show');

        try {
            const res = await authFetch(GET_MEDIA_URL + '?session_id=' + sessionId);
            const data = await res.json();
            if (!data.success) throw new Error(data.error || t('sessions_media_load_error'));

            const media = data.media || [];
            if (media.length === 0) {
                document.getElementById('mediaGrid').innerHTML = emptyStateHtml(t('sessions_media_empty'));
                return;
            }
            document.getElementById('mediaGrid').innerHTML = media.map(m =>
                m.file_type === 'video'
                    ? `<video src="${escapeHtml(m.file_path)}" controls></video>`
                    : `<a href="${escapeHtml(m.file_path)}" target="_blank"><img src="${escapeHtml(m.file_path)}" alt=""></a>`
            ).join('');
        } catch (e) {
            console.error(e);
            document.getElementById('mediaGrid').innerHTML = emptyStateHtml(t('sessions_media_load_failed'));
        }
    }

    function closeMediaModal() {
        document.getElementById('mediaOverlay').classList.remove('show');
    }

    // ==========================================================
    // Overlay dismiss handlers
    // ==========================================================
    document.getElementById('editSessionOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'editSessionOverlay') closeEditSessionModal();
    });
    document.getElementById('mediaOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'mediaOverlay') closeMediaModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeEditSessionModal(); closeMediaModal(); }
    });

    // ==========================================================
    // Init
    // ==========================================================
    if (requireAuth()) {
        renderNav('sessions.html');
        loadData();
    }

    document.addEventListener('tcs-lang-change', () => { populateFilterOptions(); renderStats(); renderSessions(); });
</script>

</body>
</html>
