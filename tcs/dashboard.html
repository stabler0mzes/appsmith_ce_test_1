<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сейчас на объектах</title>
<link rel="stylesheet" href="style.css">
<script src="app.js"></script>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-logo">
        <div class="sidebar-logo-badge">TC</div>
        TCS2
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
</aside>

<div class="main">
<div class="page">
    <div class="topbar">
        <div>
            <h1>Сейчас на объектах</h1>
            <p>Сотрудники с активной сменой прямо сейчас, сгруппированные по объектам</p>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
            Обновить
        </button>
    </div>

    <div id="errorBox" class="error-box" style="display:none;"></div>

    <div id="dashboardContent"></div>
</div>
</div>

<script>
    // ==========================================================
    // Config
    // ==========================================================
    const GET_ACTIVE_EMPLOYEES_URL = 'https://n8n.vseproi.de/webhook/tcs2-get-active-employees';

    // ==========================================================
    // State
    // ==========================================================
    let objects = [];
    let tickTimer = null;

    // ==========================================================
    // Load data
    // ==========================================================
    async function loadData() {
        const btn = document.getElementById('refreshBtn');
        btn.disabled = true;
        btn.classList.add('spinning');
        hideError();

        try {
            const res = await fetch(GET_ACTIVE_EMPLOYEES_URL, { method: 'GET' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'Ошибка загрузки данных');

            objects = data.objects || [];
            render();
        } catch (e) {
            console.error(e);
            showError('Не удалось загрузить данные. Попробуйте обновить страницу.');
        } finally {
            btn.disabled = false;
            btn.classList.remove('spinning');
        }
    }

    // ==========================================================
    // Render
    // ==========================================================
    function render() {
        const content = document.getElementById('dashboardContent');

        if (objects.length === 0) {
            content.innerHTML = emptyStateHtml('Сейчас никто не работает');
            stopTicking();
            return;
        }

        const totalEmployees = objects.reduce((sum, o) => sum + o.employees.length, 0);

        content.innerHTML = `
            <div class="stats-row" style="margin-bottom: 28px;">
                <div class="stat-card">
                    <div class="stat-label">Объектов сейчас в работе</div>
                    <div class="stat-value">${objects.length}</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Сотрудников на смене</div>
                    <div class="stat-value">${totalEmployees}</div>
                </div>
            </div>
            ${objects.map(objectSectionHtml).join('')}
        `;

        startTicking();
    }

    function objectSectionHtml(obj) {
        return `
            <div class="section">
                <div class="section-head">
                    <h2>${escapeHtml(obj.project_name)}</h2>
                    <span class="count-pill">${obj.employees.length}</span>
                </div>
                ${obj.project_address ? `<div class="ref-item-sub" style="margin: -8px 0 14px;">${escapeHtml(obj.project_address)}</div>` : ''}
                <div class="grid">
                    ${obj.employees.map(activeEmployeeCardHtml).join('')}
                </div>
            </div>`;
    }

    function activeEmployeeCardHtml(emp) {
        const name = emp.full_name || (emp.name + ' ' + emp.surname);
        return `
            <div class="card">
                <div class="card-head">
                    ${avatarHtml(emp, 'avatar')}
                    <div class="card-head-text">
                        <div class="card-name">${escapeHtml(name)}</div>
                        <div class="card-username">С ${escapeHtml(emp.start_time)}</div>
                    </div>
                </div>
                <div class="card-meta">
                    <div class="card-meta-row">
                        <span class="card-meta-label">В работе</span>
                        <span class="card-meta-value session-duration" data-start="${escapeHtml(emp.start_datetime_utc)}">—</span>
                    </div>
                </div>
            </div>`;
    }

    // ==========================================================
    // Live duration ticker
    // ==========================================================
    function formatDuration(startIso) {
        const start = new Date(startIso).getTime();
        if (isNaN(start)) return '—';
        const diffMs = Math.max(0, Date.now() - start);
        const totalMinutes = Math.floor(diffMs / 60000);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${hours}ч ${minutes}м`;
    }

    function tickDurations() {
        document.querySelectorAll('.session-duration').forEach(el => {
            el.textContent = formatDuration(el.dataset.start);
        });
    }

    function startTicking() {
        tickDurations();
        stopTicking();
        tickTimer = setInterval(tickDurations, 30000);
    }

    function stopTicking() {
        if (tickTimer) {
            clearInterval(tickTimer);
            tickTimer = null;
        }
    }

    // ==========================================================
    // Init
    // ==========================================================
    renderNav('dashboard.html');
    loadData();
</script>

</body>
</html>
